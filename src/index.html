<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Qboa Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand-block">
      <h1>QBOA <span class="accent">DIGITAL</span></h1>
      <div class="app-subtitle">Limpeza • Desengordurar • Diagnóstico</div>
    </div>
    <div class="levels">
      <button class="level" data-level="express">Express</button>
      <button class="level" data-level="normal">Normal</button>
      <button class="level" data-level="turbo">Turbo</button>
    </div>
  </header>

  <div class="section-summary" id="section-summary"></div>

  <nav class="tabs" id="tabs"></nav>

  <main class="cards" id="cards"></main>

  <section class="console" id="console">
    <div class="console-title">saída</div>
    <pre id="console-output">Selecione um item pra rodar.</pre>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
