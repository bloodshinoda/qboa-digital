<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QBoa Digital</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
      -webkit-user-select: none;
      user-select: none;
    }
    img {
      display: block;
      width: min(380px, 92vw);
      max-height: 230px;
      object-fit: contain;
      filter: drop-shadow(0 0 26px rgba(0, 89, 48, .42));
      pointer-events: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body aria-label="QBoa Digital">
  <img src="/data/logo-header.png" alt="QBoa Digital">
</body>
</html>
