[package]
name = "qboa-digital"
version = "0.1.0"
description = "Qboa Digital — utilitário de limpeza e manutenção do Windows"
authors = ["Cristiano"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "qboa-digital"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
