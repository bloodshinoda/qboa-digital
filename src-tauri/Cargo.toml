[package]
name = "qboa-digital"
version = "3.2.3"
description = "QBoa Digital — utilitário de limpeza e manutenção do Windows"
authors = ["Vilson de Oliveira Junior"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Rpc", "Win32_System_Variant", "Win32_System_Wmi"] }

[[bin]]
name = "qboa-digital"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
