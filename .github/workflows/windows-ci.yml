name: Windows CI

on:
  push:
    branches:
      - feat/cleanup-tiered-profiles
  pull_request:
    branches:
      - main
      - feat/native-rust-cleanup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Rust checks, Windows build and artifacts
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets

      - name: Build QBoa for Windows
        run: npm run build

      - name: Prepare Windows release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installerDir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $installerDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not generated in $installerDir"
          }

          $portableSource = "src-tauri/target/release/qboa-digital.exe"
          if (-not (Test-Path $portableSource -PathType Leaf)) {
            throw "Portable application executable was not generated: $portableSource"
          }

          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          Copy-Item $installer.FullName "artifacts/qboa-digital-$version-x64-installer.exe" -Force
          Copy-Item $portableSource "artifacts/qboa-digital-$version-x64-portable.exe" -Force

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: qboa-digital-windows-${{ github.sha }}
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
