name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "Application version not found in tauri.conf.json." }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate storage collector and execute all eight tests on a temporary file
        shell: pwsh
        run: |
          $env:QBOA_STORAGE_MODE = "selftest"
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "src-tauri/scripts/storage_diagnostic.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Storage collector self-test failed." }
          $measurements = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($measurements.Count -ne 8) { throw "Expected eight executed storage measurements; found $($measurements.Count)." }

          $expected = @(
            @{ kind = "seq_small_write"; unit = "MB/s"; block = 131072; queue = 1; write = $true; random = $false },
            @{ kind = "seq_small_read"; unit = "MB/s"; block = 131072; queue = 1; write = $false; random = $false },
            @{ kind = "seq_large_write"; unit = "MB/s"; block = 1048576; queue = 8; write = $true; random = $false },
            @{ kind = "seq_large_read"; unit = "MB/s"; block = 1048576; queue = 8; write = $false; random = $false },
            @{ kind = "random_small_write"; unit = "IOPS"; block = 4096; queue = 1; write = $true; random = $true },
            @{ kind = "random_small_read"; unit = "IOPS"; block = 4096; queue = 1; write = $false; random = $true },
            @{ kind = "random_large_write"; unit = "IOPS"; block = 4096; queue = 32; write = $true; random = $true },
            @{ kind = "random_large_read"; unit = "IOPS"; block = 4096; queue = 32; write = $false; random = $true }
          )

          foreach ($expectedMeasurement in $expected) {
            $actual = @($measurements | Where-Object { $_.kind -eq $expectedMeasurement.kind })
            if ($actual.Count -ne 1) { throw "Missing or duplicate measurement: $($expectedMeasurement.kind)." }
            foreach ($property in @("unit", "block", "queue", "write", "random")) {
              if ($actual[0].$property -ne $expectedMeasurement[$property]) {
                throw "Unexpected $property for measurement $($expectedMeasurement.kind)."
              }
            }
            if ([double]$actual[0].value -le 0 -or [long]$actual[0].bytes_transferred -le 0 -or [long]$actual[0].operations -le 0) {
              throw "Measurement $($expectedMeasurement.kind) did not perform successful I/O."
            }
          }
          Write-Host "All eight measurements executed against a disposable temporary file; no physical disk was targeted by the test."

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm run build

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found." }
          Copy-Item $installer.FullName "qboa-digital-${{ steps.app-version.outputs.value }}-x64-installer.exe" -Force

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: qboa-digital-windows-installer
          path: qboa-digital-${{ steps.app-version.outputs.value }}-x64-installer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Package portable application
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/qboa-digital.exe" "qboa-digital-${{ steps.app-version.outputs.value }}-x64-portable.exe" -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: qboa-digital-windows-portable
          path: qboa-digital-${{ steps.app-version.outputs.value }}-x64-portable.exe
          if-no-files-found: error
          retention-days: 14

  prepare-draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft GitHub Release with build assets
        uses: softprops/action-gh-release@v2
        with:
          name: QBoa Digital ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/qboa-digital-${{ steps.app-version.outputs.value }}-x64-installer.exe
            release-assets/qboa-digital-${{ steps.app-version.outputs.value }}-x64-portable.exe
