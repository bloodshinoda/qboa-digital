name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm run build

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found." }
          Copy-Item $installer.FullName "qboa-digital-3.1.2-x64-installer.exe" -Force

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: qboa-digital-windows-installer
          path: qboa-digital-3.1.2-x64-installer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Package portable application
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/qboa-digital.exe" "qboa-digital-3.1.2-x64-portable.exe" -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: qboa-digital-windows-portable
          path: qboa-digital-3.1.2-x64-portable.exe
          if-no-files-found: error
          retention-days: 14

  prepare-draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft GitHub Release with build assets
        uses: softprops/action-gh-release@v2
        with:
          name: QBoa Digital ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/qboa-digital-3.1.2-x64-installer.exe
            release-assets/qboa-digital-3.1.2-x64-portable.exe
