name: QBoa Memory Test — Rust checks

on:
  push:
    branches:
      - feat/qboa-memory-test
      - feat/gpu-stability-diagnostic
    paths:
      - "src-tauri/**"
      - ".github/workflows/qboa-memory-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - ".github/workflows/qboa-memory-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust formatting and unit tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
