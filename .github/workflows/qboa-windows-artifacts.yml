name: QBoa Windows — Build artifacts

on:
  push:
    branches:
      - feat/qboa-memory-test
      - feat/gpu-stability-diagnostic
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/qboa-windows-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and build Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        run: npm install

      - name: Build QBoa for Windows
        run: npm run build

      - name: Upload Windows test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qboa-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/qboa-digital.exe
          if-no-files-found: error
          retention-days: 14
